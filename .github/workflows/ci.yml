name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Windows: the app targets it, and the suite is only exercised there.
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run mypy
